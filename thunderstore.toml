[config]
schemaVersion = "0.0.1"


[package]
namespace = "Adicon"
name = "ChronosAssist"
versionNumber = "0.3.0"
description = "A training panel for the Chronos fight: what he is doing, what he can do next, and how far the fight has to go."
websiteUrl = "https://github.com/Ad1con/ChronosAssist"
containsNsfwContent = false

# Must match src/manifest.json. The release workflow rewrites versionNumber here
# from the tag you type, and does NOT touch manifest.json -- a test asserts the
# two agree, so drift fails the suite instead of shipping.
[package.dependencies]
Hell2Modding-Hell2Modding = "1.0.78"
LuaENVY-ENVY = "1.2.0"
SGG_Modding-ModUtil = "4.0.1"
SGG_Modding-ReLoad = "1.0.2"


[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build"

[[build.copy]]
source = "./CHANGELOG.md"
target = "./CHANGELOG.md"

[[build.copy]]
source = "./LICENSE"
target = "./LICENSE"

# src/ is the whole mod. Tests, docs, guard.sh and .git are outside it and so
# cannot end up in the package by accident.
[[build.copy]]
source = "./src"
target = "./plugins"


[publish]
repository = "https://thunderstore.io"
communities = [ "hades-ii", ]

[publish.categories]
hades-ii = [ "mods", ]
